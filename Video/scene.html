<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:Chiffres;src:local('Montserrat Black'),local('Montserrat-Black');font-weight:100 900;unicode-range:U+30-39}
html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<svg id="m" width="0" height="0" style="position:absolute"></svg>
<script>
// Film « Pour la Joie de Marie » : chaque image est une fonction pure du temps t (secondes), 80 s au total.
const W = 1920, H = 1080, DUR = 80;
const C = { bleu: '#0A71B8', jaune: '#F39200', nuit: '#05213d', nuit2: '#020d1c', blanc: '#ffffff', ciel: '#1d8ad6' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const buf = mk(), bg = buf.getContext('2d');
const tmp = mk(), tg = tmp.getContext('2d');

// ---------- maths ----------
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eBack = x => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// entrée (0→1, expo) et sortie (0→1, accélérée) d'un élément
function io(t, a, b, din = .7, dout = .35) { return { i: eExpo(p(t, a, a + din)), o: eInExpo(p(t, b - dout, b)) }; }

// ---------- texte ----------
function font(g, o) { g.font = `${o.w || 900} ${o.size || 100}px Chiffres, Raleway`; g.letterSpacing = (o.ls || 0) + 'px'; }
function txt(g, s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= .002) return;
  const ga = g.globalAlpha;
  g.save(); g.translate(x, y); if (o.rot) g.rotate(o.rot); g.scale(o.sx ?? o.sc ?? 1, o.sy ?? o.sc ?? 1);
  font(g, o); g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.blur > .3) g.filter = `blur(${o.blur}px)`;
  if (o.shadow) { g.shadowColor = o.shadow; g.shadowBlur = o.shadowBlur || 40; }
  const sm = o.smear || 0, smy = o.smearY || 0, n = (Math.abs(sm) + Math.abs(smy)) > 2 ? 7 : 1;
  for (let i = n - 1; i >= 0; i--) {
    const k = n > 1 ? i / (n - 1) : 0;
    g.globalAlpha = ga * a * (i === 0 ? 1 : .22 * (1 - k * .8));
    if (o.stroke) { g.strokeStyle = o.color || '#fff'; g.lineWidth = o.stroke; g.strokeText(s, -sm * k, -smy * k); }
    else { g.fillStyle = o.color || '#fff'; g.fillText(s, -sm * k, -smy * k); }
  }
  g.restore();
}
function width(g, s, o) { g.save(); font(g, o); const w = g.measureText(s).width; g.restore(); return w; }
// révélation lettre par lettre : chaque lettre monte, se défloute et s'éclaire
function letters(g, s, x, y, o, t, t0, st = .03, d = .7, dy = 80, blur = 22) {
  g.save(); font(g, o);
  const tot = g.measureText(s).width, x0 = o.align === 'left' ? x : o.align === 'right' ? x - tot : x - tot / 2;
  const xs = [...s].map((_, i) => g.measureText(s.slice(0, i)).width);
  g.restore();
  [...s].forEach((ch, i) => {
    if (ch === ' ') return;
    const k = eExpo(p(t, t0 + i * st, t0 + i * st + d)); if (k <= 0) return;
    txt(g, ch, x0 + xs[i], y + (1 - k) * dy, { ...o, align: 'left', a: (o.a ?? 1) * Math.min(1, k * 1.6), blur: (o.blur || 0) + (1 - k) * blur, sy: lerp(1.6, 1, k), sx: 1 });
  });
}
function words(g, s, x, y, o, t, t0, st = .07, d = .6) {
  const ws = s.split(' '); let cx = x;
  const sp = width(g, ' ', o);
  ws.forEach((w, i) => {
    const k = eExpo(p(t, t0 + i * st, t0 + i * st + d));
    if (k > 0) txt(g, w, cx, y + (1 - k) * 40, { ...o, align: 'left', a: (o.a ?? 1) * k, blur: (1 - k) * 12 });
    cx += width(g, w, o) + sp;
  });
}
function pill(g, x, y, w, h, color, k = 1) {
  g.save(); g.translate(x, y); g.scale(k, 1); g.fillStyle = color;
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.fill(); g.restore();
}

// ---------- logo (chemins de logoPJM3.svg, injectés par render.js) ----------
let LOGO = [];
function initLogo(paths) {
  const svg = document.getElementById('m');
  LOGO = paths.map(({ cls, d }) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path'); el.setAttribute('d', d); svg.appendChild(el);
    const b = el.getBBox();
    return { cls, p2: new Path2D(d), len: el.getTotalLength(), cx: b.x + b.width / 2, cy: b.y + b.height / 2 };
  });
}
// drawT : secondes depuis le début du tracé ; starT : secondes depuis l'apparition des étoiles
function logo(g, cx, cy, h, drawT = 99, starT = 99, ink = '#fff', glow = 0) {
  const s = h / 507.59;
  g.save(); g.translate(cx - 267.58 * s / 2, cy - h / 2); g.scale(s, s);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 10;
  let si = 0, li = 0;
  for (const P of LOGO) {
    if (P.cls === 'cls-1') {
      const j = si++, k = eBack(p(starT, j * .09, j * .09 + .5)); if (k <= 0) continue;
      g.save(); g.translate(P.cx, P.cy); g.rotate((1 - k) * 2.5); g.scale(k, k); g.translate(-P.cx, -P.cy);
      g.fillStyle = C.jaune; if (glow) { g.shadowColor = '#ffd27a'; g.shadowBlur = 30 * glow; }
      g.fill(P.p2); g.restore();
      // éclat
      const f = p(starT, j * .09, j * .09 + .6);
      if (f > 0 && f < 1) {
        g.save(); g.strokeStyle = `rgba(255,220,150,${1 - f})`; g.lineWidth = 3;
        for (let r = 0; r < 8; r++) { const an = r * Math.PI / 4, r0 = 18 + f * 40, r1 = r0 + 14 * (1 - f); g.beginPath(); g.moveTo(P.cx + Math.cos(an) * r0, P.cy + Math.sin(an) * r0); g.lineTo(P.cx + Math.cos(an) * r1, P.cy + Math.sin(an) * r1); g.stroke(); }
        g.restore();
      }
    } else {
      const j = li++, k = eIO(p(drawT, j * .3, j * .3 + 1.4)); if (k <= 0) continue;
      g.save(); g.strokeStyle = P.cls === 'cls-2' ? C.jaune : ink;
      if (glow) { g.shadowColor = P.cls === 'cls-2' ? C.jaune : 'rgba(255,255,255,.9)'; g.shadowBlur = 24 * glow; }
      g.setLineDash([P.len * k, P.len]); g.stroke(P.p2); g.restore();
    }
  }
  g.restore();
}

// ---------- photos ----------
let CFG = {};
let IMGS = [];
async function initPhotos(dir, cfg) {
  CFG = cfg;
  IMGS = await Promise.all(CFG.photos.map(n => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = `${dir}/${n}.JPG`; })));
  IMGS = IMGS.filter(Boolean);
}
function cover(g, im, x, y, w, h) {
  const s = Math.max(w / im.width, h / im.height), sw = w / s, sh = h / s;
  g.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, w, h);
}
function card(g, im, cx, cy, w, h, rot, blur, a) {
  g.save(); g.globalAlpha = a; g.translate(cx, cy); g.rotate(rot);
  if (blur > .3) g.filter = `blur(${blur}px)`;
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 18;
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20, 14); g.fill();
  g.shadowColor = 'transparent';
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 8); g.clip(); cover(g, im, -w / 2, -h / 2, w, h);
  g.restore();
}

// ---------- décors ----------
function radial(g, c0, c1, x = W / 2, y = H / 2, r = 1200) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function rays(g, x, y, t, a = .06, n = 14) {
  g.save(); g.translate(x, y); g.rotate(t * .05); g.fillStyle = `rgba(255,255,255,${a})`;
  for (let i = 0; i < n; i++) { g.rotate(Math.PI * 2 / n); g.beginPath(); g.moveTo(0, 0); g.lineTo(2400, -110); g.lineTo(2400, 110); g.fill(); }
  g.restore();
}
const BOKEH = (() => { const r = rng(7); return Array.from({ length: 26 }, () => ({ x: r() * W, y: r() * H, rad: 30 + r() * 120, sp: 10 + r() * 30, a: .04 + r() * .1, c: r() < .4 ? '243,146,0' : '255,255,255' })); })();
function bokeh(g, t, k = 1) {
  for (const b of BOKEH) {
    const x = (b.x + t * b.sp) % (W + 300) - 150, y = b.y + Math.sin(t * .4 + b.x) * 30;
    const gr = g.createRadialGradient(x, y, 0, x, y, b.rad); gr.addColorStop(0, `rgba(${b.c},${b.a * k})`); gr.addColorStop(1, `rgba(${b.c},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, b.rad, 0, 7); g.fill();
  }
}
// pétales de rose (jaune / blanc) qui tombent en parallaxe
const PETALS = (() => { const r = rng(42); return Array.from({ length: 60 }, () => ({ x: r() * W, y: r() * H, z: .3 + r() * .9, sp: r() * 6, w: r(), c: r() < .55 ? C.jaune : r() < .5 ? '#ffffff' : '#ffc46b' })); })();
function petal(g, x, y, s, rot, flip, color, a) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot); g.scale(s * flip, s); g.fillStyle = color;
  g.beginPath(); g.moveTo(0, -1); g.bezierCurveTo(.95, -.9, .8, .75, 0, 1); g.bezierCurveTo(-.8, .75, -.95, -.9, 0, -1); g.fill(); g.restore();
}
function petals(g, t, k = 1, wind = 0) {
  if (k <= 0) return;
  for (const q of PETALS) {
    const fall = 60 + q.z * 110, y = (q.y + t * fall) % (H + 200) - 100;
    const x = ((q.x + Math.sin(t * .7 + q.sp) * 80 + t * (40 + wind) * q.z) % (W + 200) + W + 200) % (W + 200) - 100;
    const s = 9 + q.z * 16;
    g.save(); if (q.z < .6) g.filter = `blur(${(0.6 - q.z) * 10}px)`; if (q.z > 1.05) g.filter = `blur(${(q.z - 1.05) * 30}px)`;
    petal(g, x, y, s, t * (1 + q.sp * .3) + q.sp, Math.cos(t * 2 + q.sp * 3), q.c, k * (q.c === '#ffffff' ? .8 : .9));
    g.restore();
  }
}
const STARS = (() => { const r = rng(3); return Array.from({ length: 420 }, () => ({ x: (r() - .5) * 2, y: (r() - .5) * 2, z: r(), c: r() < .25 ? '243,146,0' : '255,255,255' })); })();
// champ d'étoiles en hyperespace ; dist(t) = distance parcourue (vitesse intégrée)
function warp(g, dist, speed, a = 1) {
  g.save(); g.lineCap = 'round';
  for (const s of STARS) {
    const z = ((s.z - dist) % 1 + 1) % 1 + .02, z2 = Math.min(1.02, z + speed * .02);
    const x = W / 2 + s.x / z * 500, y = H / 2 + s.y / z * 500, x2 = W / 2 + s.x / z2 * 500, y2 = H / 2 + s.y / z2 * 500;
    const al = a * cl(1 - z) * cl((1.02 - z) * 4);
    g.strokeStyle = `rgba(${s.c},${al})`; g.lineWidth = cl(2.6 / z / 3, .5, 5);
    g.beginPath(); g.moveTo(x2, y2); g.lineTo(x + .1, y); g.stroke();
  }
  g.restore();
}
function grid(g, t, color, a) {
  g.save(); g.fillStyle = color; g.globalAlpha = a;
  const off = (t * 30) % 60;
  for (let x = -60; x < W + 60; x += 60) for (let y = -60; y < H + 60; y += 60) { g.beginPath(); g.arc(x + off, y + off * .5, 2.2, 0, 7); g.fill(); }
  g.restore();
}
function ring(g, x, y, k, color, maxR = 900, wdt = 30) {
  if (k <= 0 || k >= 1) return;
  g.save(); g.strokeStyle = color; g.globalAlpha = (1 - k); g.lineWidth = wdt * (1 - k) + 1;
  g.beginPath(); g.arc(x, y, eOut(k) * maxR, 0, 7); g.stroke(); g.restore();
}
function speedLines(g, k, dir = 1, seed = 1) {
  if (k <= .02) return;
  const r = rng(seed); g.save();
  for (let i = 0; i < 40; i++) {
    const y = r() * H, len = 300 + r() * 900, x = r() * W;
    g.fillStyle = r() < .5 ? `rgba(255,255,255,${.5 * k})` : `rgba(243,146,0,${.6 * k})`;
    g.fillRect(x - len / 2, y, len, 1 + r() * 3);
  }
  g.restore();
}
const fmt = n => Math.round(n).toLocaleString('fr-FR').replace(/\s/g, ' ');

// =================== SCÈNES ===================
// chaque scène dessine dans g avec lt = temps local ; elle doit accepter lt hors de [0, durée] pendant les transitions
const S = [];
const scene = (a, b, fn, trans = 'cut', td = .5) => S.push({ a, b, fn, trans, td });

// 0 — Intro : hyperespace, trois phrases qui jaillissent de la profondeur
scene(0, 7, (g, t) => {
  radial(g, '#0c3a66', C.nuit2, W / 2, H / 2, 1300);
  const speed = .25 + eInExpo(p(t, 4.5, 7)) * 6 + p(t, 0, 2) * .3;
  const dist = .08 * t + .06 * t * t / 7 + (t > 4.5 ? Math.pow(t - 4.5, 3) * .05 : 0);
  warp(g, dist, speed, cl(t / .8));
  const L = [['Un jour.', .5, 2.9, '#fff'], ['Une Mère.', 3.0, 5.0, '#fff'], ['Des milliers de roses.', 5.1, 7.05, C.jaune]];
  for (const [s, a, b, col] of L) {
    if (t < a || t > b) continue;
    const e = io(t, a, b, .8, .45), sc = lerp(2.6, 1, e.i) * (1 + (t - a) * .03) * lerp(1, 5, e.o);
    txt(g, s, W / 2, H / 2, { size: s.length > 12 ? 130 : 170, color: col, sc, blur: (1 - e.i) * 30 + e.o * 40, a: e.i * (1 - e.o * .9), shadow: col === C.jaune ? 'rgba(243,146,0,.6)' : 'rgba(255,255,255,.35)' });
  }
  txt(g, '8 DÉCEMBRE', W / 2, H / 2 + 150, { size: 34, w: 700, ls: 14, color: 'rgba(255,255,255,.7)', a: p(t, 1.2, 2) * (1 - p(t, 2.6, 2.9)), blur: (1 - p(t, 1.2, 2)) * 10 });
});

// 1 — Logo qui se dessine, étoiles, titre
scene(7, 15, (g, t) => {
  radial(g, '#2a9be6', C.bleu, W / 2, 470, 1100);
  rays(g, W / 2, 470, t, .05 * cl(t / 1.5));
  bokeh(g, t, 1);
  petals(g, t + 7, p(t, 4, 6) * .8);
  const up = eIO(p(t, 4.0, 4.9)), push = 1 + t * .012;
  const lh = lerp(640, 470, up) * push, ly = lerp(530, 360, up);
  // halo derrière le logo
  const gl = g.createRadialGradient(W / 2, ly, 0, W / 2, ly, 420); gl.addColorStop(0, `rgba(255,255,255,${.22 * p(t, .5, 3)})`); gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  logo(g, W / 2, ly, lh, t - .15, t - 2.9, '#fff', 1 - p(t, 3, 5) * .6);
  letters(g, 'POUR LA JOIE DE MARIE', W / 2, 720 + (1 - up) * 40, { size: 104, color: '#fff', ls: 4, shadow: 'rgba(0,0,0,.25)', shadowBlur: 30 }, t, 4.3, .035, .8);
  const bk = eBack(p(t, 5.6, 6.2));
  pill(g, W / 2, 835, 330, 66, C.jaune, bk);
  txt(g, 'ÉDITION ' + CFG.annee, W / 2, 837, { size: 30, w: 800, ls: 6, color: '#fff', a: p(t, 5.9, 6.3) });
}, 'flash', .3);

// 2 — Les chiffres
scene(15, 19.4, (g, t) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  grid(g, t, C.bleu, .09);
  letters(g, CFG.editions, W / 2, 300, { size: 40, w: 800, ls: 12, color: C.bleu }, t, .25, .025, .6, 30, 10);
  const k = eOut(p(t, .4, 2.6)), land = p(t, 2.6, 3.0);
  const sc = 1 + Math.sin(land * Math.PI) * .08;
  txt(g, fmt(CFG.rosesOffertes * k), W / 2, 520, { size: 300, color: C.jaune, sc, blur: (1 - p(t, .3, .9)) * 25, a: p(t, .3, .7), smearY: (1 - k) * 40 });
  letters(g, 'ROSES OFFERTES', W / 2, 720, { size: 110, color: C.bleu, ls: 2 }, t, .9, .04, .7);
  ring(g, W / 2, 520, p(t, 2.6, 3.6), C.jaune, 700, 24);
  petals(g, t + 15, p(t, 2.6, 3.4) * .7);
}, 'zoom', .8);

// 3 — Pays qui défilent + carte centrale
scene(19.4, 25, (g, t) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const acc = eInExpo(p(t, 4.9, 5.6)) * 2500;
  const rows = [[120, 70, -1, 90, .3, 6], [300, 120, 1, 160, .7, 0], [790, 120, -1, 200, .7, 0], [960, 70, 1, 110, .3, 6]];
  rows.forEach(([y, size, dir, sp, al, blur], ri) => {
    const PAYS = CFG.pays, line = (PAYS.slice(ri * 2).concat(PAYS.slice(0, ri * 2))).join('  •  ') + '  •  ';
    const wd = width(g, line, { size, w: 900 });
    const off = ((t * sp + acc * (1 + ri * .2)) % wd);
    const x0 = dir < 0 ? -off : off - wd;
    for (let x = x0; x < W + wd; x += wd) {
      if (ri % 2) txt(g, line, x, y, { size, align: 'left', color: C.bleu, a: al, blur });
      else txt(g, line, x, y, { size, align: 'left', color: C.bleu, a: al, stroke: 2.5, blur });
    }
  });
  // bande bleue
  const w = eExpo(p(t, .3, 1.1));
  g.save(); g.translate(W / 2, 545); g.rotate(-.03); g.fillStyle = C.bleu; g.fillRect(-W * .6 * w, -160, W * 1.2 * w, 320); g.restore();
  g.save(); g.translate(W / 2, 545); g.rotate(-.03);
  letters(g, CFG.nbPays + ' PAYS.', -300, -10, { size: 190, color: '#fff', align: 'center' }, t, .7, .05, .7);
  letters(g, 'UN SEUL', 330, -55, { size: 100, color: C.jaune, align: 'center' }, t, 1.5, .04, .7);
  letters(g, 'BOUQUET.', 330, 55, { size: 100, color: '#fff', align: 'center' }, t, 1.8, .04, .7);
  g.restore();
}, 'whip', .5);

// 4 — Galerie en parallaxe
const LAYERS = (() => {
  const r = rng(11), L = [];
  [[.35, 12, 300, 240, [170, 560, 920], 330, 55, 6, .45], [.65, 9, 420, 320, [300, 800], 470, 120, 1.8, .8], [1, 6, 600, 450, [380, 720], 720, 240, 0, 1]].forEach(([z, n, h, w, ys, spc, sp, blur, a], li) => {
    for (let i = 0; i < n; i++) L.push({ z, h, w, y: ys[i % ys.length] + (r() - .5) * 60, x0: i * spc + r() * 80, span: n * spc, sp, blur, a, rot: (r() - .5) * .12, img: (li * 7 + i * 3) % 24 });
  });
  return L;
})();
scene(25, 37, (g, t) => {
  radial(g, '#0e4f86', C.nuit2, W / 2, H / 2, 1300);
  bokeh(g, t + 25, 1.2);
  const zoom = 1 + t * .008, extra = Math.pow(Math.max(0, t - 10.6), 2) * 1800;
  g.save(); g.translate(W / 2, H / 2); g.scale(zoom, zoom); g.translate(-W / 2, -H / 2);
  for (const c of LAYERS) {
    const x = ((c.x0 - (t * c.sp + extra * c.z)) % c.span + c.span) % c.span - c.w;
    const im = IMGS[c.img % IMGS.length]; if (!im) continue;
    card(g, im, x, c.y + Math.sin(t * .5 + c.x0) * 10 * c.z, c.w, c.h, c.rot, c.blur + (extra > 0 ? c.z * 8 * p(t, 10.6, 12) : 0), c.a);
  }
  g.restore();
  // voile pour lire le texte
  const gr = g.createLinearGradient(0, 260, 0, 820); gr.addColorStop(0, 'rgba(2,13,28,0)'); gr.addColorStop(.5, 'rgba(2,13,28,.86)'); gr.addColorStop(1, 'rgba(2,13,28,0)');
  g.fillStyle = gr; g.fillRect(0, 260, W, 560);
  petals(g, t + 25, .6, 60);
  const e1 = io(t, 1, 6.2, .7, .4);
  g.save(); g.globalAlpha = 1 - e1.o; g.translate(0, -e1.o * 120);
  letters(g, 'Dans chaque paroisse,', W / 2, 470, { size: 110, color: '#fff' }, t, 1, .03, .7);
  letters(g, 'une rose devient prière.', W / 2, 610, { size: 110, color: C.jaune }, t, 2.5, .03, .7);
  g.restore();
  const e2 = io(t, 6.6, 12.3, .7, .5);
  g.save(); g.globalAlpha = 1 - e2.o;
  letters(g, 'Cette année,', W / 2, 470, { size: 120, color: '#fff', sc: 1 + e2.o * .5 }, t, 6.6, .04, .7);
  letters(g, "c'est votre tour.", W / 2, 620, { size: 150, color: C.jaune, shadow: 'rgba(243,146,0,.5)' }, t, 8.0, .04, .8);
  g.restore();
}, 'whip', .5);

// 5 — « Comment participer »
scene(37, 40, (g, t) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  grid(g, t, C.bleu, .07);
  const bk = eBack(p(t, .15, .6));
  pill(g, W / 2, 380, 470, 76, C.jaune, bk);
  txt(g, 'COMMENT PARTICIPER', W / 2, 382, { size: 32, w: 800, ls: 6, color: '#fff', a: p(t, .4, .7) });
  letters(g, '3 gestes.', W / 2, 545, { size: 190, color: C.bleu }, t, .5, .05, .7);
  letters(g, "C'est tout.", W / 2, 720, { size: 120, color: C.jaune }, t, 1.3, .05, .7);
}, 'zoom', .8);

// 6-8 — les trois étapes
const ETAPES = [
  { n: '1', titre: ["Je m'inscris"], texte: ['Je remplis le formulaire avec le nombre', 'de roses que je veux offrir.'], fond: C.bleu, ink: '#fff', sub: 'rgba(255,255,255,.85)' },
  { n: '2', titre: ["J'achète", 'mes roses'], texte: ['Des roses naturelles, de la couleur de mon cœur.', "Aucun argent n'est à transmettre."], fond: '#fff', ink: C.bleu, sub: C.bleu },
  { n: '3', titre: ['Je les dépose', 'le 8 décembre'], texte: ["Dans ma paroisse, le jour de", "l'Immaculée Conception."], fond: C.bleu, ink: '#fff', sub: 'rgba(255,255,255,.85)' },
];
ETAPES.forEach((E, i) => scene(40 + i * 6, 46 + i * 6, (g, t) => {
  g.fillStyle = E.fond; g.fillRect(0, 0, W, H);
  if (E.fond === C.bleu) { radial(g, 'rgba(42,155,230,.9)', 'rgba(10,113,184,0)', 450, 540, 900); bokeh(g, t + i * 9, .8); }
  else grid(g, t, C.bleu, .07);
  // grand chiffre fantôme en parallaxe lente
  txt(g, E.n, 1500 - t * 25, 560, { size: 1300, color: E.fond === C.bleu ? '#fff' : C.bleu, a: .07, stroke: 4 });
  const k = eExpo(p(t, .1, .8));
  const vel = (1 - k) * 260;
  txt(g, E.n, 470 + (1 - k) * 900 - t * 8, 560, { size: 640, color: C.jaune, smear: -vel, shadow: 'rgba(0,0,0,.18)', shadowBlur: 50 });
  const ty = 470 - (E.titre.length - 1) * 60;
  E.titre.forEach((l, j) => letters(g, l, 850, ty + j * 120, { size: 120, color: E.ink, align: 'left' }, t, .4 + j * .25, .03, .7));
  const by = ty + (E.titre.length - 1) * 120 + 95;
  g.fillStyle = C.jaune; g.fillRect(852, by, 180 * eExpo(p(t, .9, 1.5)), 10);
  E.texte.forEach((l, j) => words(g, l, 852, by + 85 + j * 62, { size: 42, w: 500, color: E.sub }, t, 1.2 + j * .3, .06));
  petals(g, t + 40 + i * 6, .55);
}, i === 0 ? 'whip' : 'whip', .5));

// 9 — Typographie cinétique, coupes sur le temps
const KIN = [
  [0, 1.5, C.bleu, [['Aucun argent', '#fff', 150], ['à envoyer.', C.jaune, 150]]],
  [1.5, 2.5, C.jaune, [['Vos roses.', '#fff', 220]]],
  [2.5, 3.5, '#fff', [['Votre paroisse.', C.bleu, 190]]],
  [3.5, 4.5, C.bleu, [['Votre cœur.', C.jaune, 220]]],
  [4.5, 5.5, C.nuit, [['Le même jour,', '#fff', 190]]],
];
scene(58, 66, (g, t) => {
  const seg = KIN.find(s => t >= s[0] && t < s[1]);
  if (seg) {
    const lt = t - seg[0];
    g.fillStyle = seg[2]; g.fillRect(0, 0, W, H);
    const k = eExpo(p(lt, 0, .3)), sc = lerp(1.5, 1, k) * (1 + lt * .04);
    const sh = (1 - p(lt, 0, .25)) * 18;
    seg[3].forEach(([s, col, size], j) => {
      const y = H / 2 + (j - (seg[3].length - 1) / 2) * size * 1.05;
      txt(g, s, W / 2 + Math.sin(lt * 90) * sh, y, { size, color: col, sc, blur: (1 - k) * 22, a: cl(k * 2) });
    });
    return;
  }
  // « UNIS » final
  const lt = t - 5.5;
  radial(g, '#0e4f86', C.nuit2, W / 2, H / 2, 1200);
  rays(g, W / 2, H / 2, t * 3, .05);
  warp(g, lt * .3, .5, .7);
  const k = eExpo(p(lt, 0, .5));
  txt(g, 'UNIS', W / 2, 470, { size: 340, color: C.jaune, ls: lerp(0, 40, p(lt, 0, 2.5)), sc: lerp(2, 1, k), blur: (1 - k) * 30, a: k, shadow: 'rgba(243,146,0,.55)', shadowBlur: 60 });
  letters(g, 'partout dans le monde.', W / 2, 700, { size: 90, color: '#fff' }, lt, .4, .03, .7);
}, 'zoom', .8);

// 10 — Date + objectif
scene(66, 73, (g, t) => {
  const pan = eIO(p(t, 3.8, 4.3)) * H; // panoramique vertical vers l'objectif
  radial(g, '#1478c4', C.nuit, W / 2, H / 2 - pan * .2, 1300);
  petals(g, t + 66, .5);
  g.save(); g.translate(0, -pan);
  const smy = Math.sin(p(t, 3.8, 4.3) * Math.PI) * 200;
  const k = eExpo(p(t, 0, .5));
  txt(g, '8', 520, 560, { size: 900, color: C.jaune, sc: lerp(3, 1, k), blur: (1 - k) * 40, a: k, shadow: 'rgba(243,146,0,.5)', shadowBlur: 80, smearY: smy });
  ring(g, 520, 540, p(t, .3, 1.5), '#fff', 1100, 40);
  const k2 = eExpo(p(t, .6, 1.2));
  txt(g, 'DÉCEMBRE', 860 + (1 - k2) * 700, 470, { size: 180, align: 'left', color: '#fff', smear: -(1 - k2) * 300, a: k2, smearY: smy });
  const k3 = eExpo(p(t, 1.2, 1.8));
  txt(g, String(CFG.annee), 865 + (1 - k3) * 700, 640, { size: 180, align: 'left', color: C.jaune, stroke: 5, smear: -(1 - k3) * 300, a: k3, smearY: smy });
  words(g, "Fête de l'Immaculée Conception", 870, 780, { size: 46, w: 500, color: 'rgba(255,255,255,.85)' }, t, 2.0, .08);
  // objectif
  const oy = H;
  letters(g, 'OBJECTIF', W / 2, oy + 260, { size: 44, w: 800, ls: 18, color: 'rgba(255,255,255,.85)' }, t, 4.2, .03, .6, 30, 10);
  const c = eOut(p(t, 4.3, 6.0)), land = p(t, 6.0, 6.4);
  txt(g, fmt(CFG.objectif * c), W / 2, oy + 520, { size: 360, color: C.jaune, sc: 1 + Math.sin(land * Math.PI) * .1, shadow: 'rgba(243,146,0,.5)', shadowBlur: 60, a: p(t, 4.2, 4.5), smearY: (1 - c) * 50 });
  letters(g, 'ROSES', W / 2, oy + 790, { size: 150, color: '#fff', ls: 10 }, t, 4.6, .05, .7);
  ring(g, W / 2, oy + 520, p(t, 6.0, 7.0), C.jaune, 900, 30);
  // gerbe de pétales
  const bt = t - 6.0;
  if (bt > 0) { const r = rng(5); for (let i = 0; i < 70; i++) { const an = r() * 7, v = 400 + r() * 1100, x = W / 2 + Math.cos(an) * v * eOut(cl(bt / 1.2)), y = oy + 520 + Math.sin(an) * v * eOut(cl(bt / 1.2)) + bt * bt * 300; petal(g, x, y, 10 + r() * 14, an + bt * 4, Math.cos(bt * 6 + i), r() < .6 ? C.jaune : '#fff', cl(1.6 - bt)); } }
  g.restore();
}, 'flash', .3);

// 11 — Appel à l'action
scene(73, 80, (g, t) => {
  radial(g, '#2a9be6', C.bleu, W / 2, 380, 1200);
  rays(g, W / 2, 300, t, .05);
  bokeh(g, t + 73, 1);
  petals(g, t + 73, .8);
  const k = eExpo(p(t, 0, 1));
  logo(g, W / 2, 255, 330 * lerp(.7, 1, k), 99, t - .2, '#fff', .5);
  letters(g, 'Joignez votre rose aux nôtres', W / 2, 520, { size: 96, color: '#fff' }, t, .4, .025, .7);
  letters(g, 'et offrons à Marie un beau bouquet.', W / 2, 625, { size: 62, w: 700, color: C.jaune }, t, 1.2, .02, .7);
  const b = eBack(p(t, 2.0, 2.6)), pulse = 1 + Math.sin(Math.max(0, t - 2.6) * 4) * .025 * p(t, 2.6, 3);
  [3.0, 4.4, 5.8].forEach(tp => { const q = p(t, tp, tp + 1.2); if (q > 0 && q < 1) { g.save(); g.strokeStyle = `rgba(255,255,255,${.7 * (1 - q)})`; g.lineWidth = 4; g.beginPath(); g.roundRect(W / 2 - 230 - q * 60, 785 - 50 - q * 30, 460 + q * 120, 100 + q * 60, 60); g.stroke(); g.restore(); } });
  g.save(); g.translate(W / 2, 785); g.scale(b * pulse, b * pulse);
  g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 40; g.shadowOffsetY = 12; pill(g, 0, 0, 460, 100, '#fff'); g.restore();
  txt(g, 'PARTICIPER', W / 2, 788, { size: 46, w: 900, ls: 6, color: C.bleu, a: p(t, 2.3, 2.6), sc: b * pulse });
  const url = CFG.site, n = Math.floor(p(t, 2.8, 4.0) * url.length);
  txt(g, url.slice(0, n), W / 2, 930, { size: 44, w: 600, ls: 3, color: '#fff', a: .95 });
  const fade = p(t, 6.4, 7);
  if (fade > 0) { g.fillStyle = `rgba(2,13,28,${fade})`; g.fillRect(0, 0, W, H); }
}, 'zoom', .8);

// =================== COMPOSITION ===================
const vign = (() => { const c = mk(), g = c.getContext('2d'); const gr = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,10,25,.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();
const grain = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'), d = g.createImageData(512, 512), r = rng(9); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();

function drawScene(g, s, t, ox = 0, sc = 1) {
  g.save(); g.translate(W / 2 + ox, H / 2); g.scale(sc, sc); g.translate(-W / 2, -H / 2);
  s.fn(g, t - s.a); g.restore();
}
// floute la toile src en la redessinant décalée (fil = traînée horizontale) ou agrandie (zoom = flou radial)
function blurPass(dst, src, mode, amt) {
  const N = 10;
  for (let i = 0; i < N; i++) {
    dst.globalAlpha = 1 / (i + 1);
    if (mode === 'zoom') { const s = 1 + amt * i / N; dst.drawImage(src, W / 2 - W * s / 2, H / 2 - H * s / 2, W * s, H * s); }
    else dst.drawImage(src, (i / (N - 1) - .5) * amt, 0);
  }
  dst.globalAlpha = 1;
}
function seek(t) {
  bg.setTransform(1, 0, 0, 1, 0, 0); bg.clearRect(0, 0, W, H);
  let fx = { zoom: 0, smear: 0, flash: 0, lines: 0, dir: 1 };
  const i = S.findIndex(s => t >= s.a && t < s.b), cur = S[i === -1 ? S.length - 1 : i];
  const nxt = S[S.indexOf(cur) + 1], prv = S[S.indexOf(cur) - 1];
  // transition active ? (centrée sur la frontière a)
  let T = null;
  if (nxt && t > nxt.a - nxt.td / 2) T = [cur, nxt]; else if (prv && t < cur.a + cur.td / 2) T = [prv, cur];
  if (!T) drawScene(bg, cur, t);
  else {
    const [A, B] = T, k = p(t, B.a - B.td / 2, B.a + B.td / 2);
    if (B.trans === 'whip') {
      const e = eIO(k);
      drawScene(bg, A, t, -W * e); drawScene(bg, B, t, W * (1 - e));
      fx.smear = Math.sin(k * Math.PI) * 260; fx.lines = Math.sin(k * Math.PI);
    } else if (B.trans === 'zoom') {
      if (k < .5) drawScene(bg, A, t, 0, 1 + eIn(k * 2) * 2.5); else drawScene(bg, B, t, 0, lerp(.55, 1, eExpo((k - .5) * 2)));
      fx.zoom = Math.sin(k * Math.PI) * .45; fx.flash = Math.max(0, 1 - Math.abs(k - .5) * 6) * .8;
    } else if (B.trans === 'flash') {
      drawScene(bg, k < .5 ? A : B, t); fx.flash = Math.max(0, 1 - Math.abs(k - .5) * 2.4);
    } else drawScene(bg, k < .5 ? A : B, t);
  }
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (fx.zoom > .01) blurPass(ctx, buf, 'zoom', fx.zoom);
  else if (fx.smear > 2) blurPass(ctx, buf, 'smear', fx.smear);
  else ctx.drawImage(buf, 0, 0);
  speedLines(ctx, fx.lines, 1, Math.floor(t * 30));
  if (fx.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${fx.flash})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(vign, 0, 0);
  ctx.globalAlpha = .05; ctx.globalCompositeOperation = 'overlay';
  const r = rng(Math.floor(t * 30) + 1); ctx.drawImage(grain, -r() * 512, -r() * 512, W + 1024, H + 1024);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
window.seek = seek; window.initLogo = initLogo; window.initPhotos = initPhotos;
</script>
